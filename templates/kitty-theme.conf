# vim:ft=kitty
# ruxtheme: rendered from ~/.config/ruxtheme/templates/kitty-theme.conf
# Theme: ${ct_label}   Accent: ${ct_accent_name} ${ct_accent}
# Do not hand-edit. Change the template, then run: ruxtheme set ${ct_name}

background            ${ct_base}
foreground            ${ct_text}
selection_background  ${ct_surface2}
selection_foreground  ${ct_text}
url_color             ${ct_sky}
cursor                ${ct_accent}
cursor_text_color     ${ct_base}

# Chrome uses the accent, so the ANSI palette below stays semantically correct.
active_tab_background    ${ct_accent}
active_tab_foreground    ${ct_base}
inactive_tab_background  ${ct_surface0}
inactive_tab_foreground  ${ct_overlay1}
tab_bar_background       ${ct_mantle}
active_border_color      ${ct_accent}
inactive_border_color    ${ct_surface1}
bell_border_color        ${ct_yellow}

# ANSI 0-7: standard terminal meanings, so ls/grep/git colours stay readable.
# color4 is deliberately blue, not the mauve accent.
color0 ${ct_surface1}
color1 ${ct_red}
color2 ${ct_green}
color3 ${ct_yellow}
color4 ${ct_blue}
color5 ${ct_pink}
color6 ${ct_teal}
color7 ${ct_subtext1}

# ANSI 8-15: bright
color8  ${ct_surface2}
color9  ${ct_red}
color10 ${ct_green}
color11 ${ct_yellow}
color12 ${ct_blue}
color13 ${ct_pink}
color14 ${ct_teal}
color15 ${ct_subtext0}

# extended
color16 ${ct_peach}
color17 ${ct_maroon}
