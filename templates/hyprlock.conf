# ${ct_label}
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ${ct_wallpaper}
    blur_passes = 2
    brightness = 0.6
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(${ct_base_h}cc)

    outer_color = rgba(${ct_accent_h}ee) rgba(${ct_sky_h}ee) 45deg
    check_color = rgba(${ct_green_h}ee) rgba(${ct_teal_h}ee) 120deg
    fail_color = rgba(${ct_red_h}ee) rgba(${ct_peach_h}ee) 40deg

    font_color = rgb(${ct_text_h})
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = <i>Password...</i>
    fail_text = $PAMFAIL

    dots_spacing = 0.3

    position = 0, -120
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgb(${ct_text_h})

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font
    color = rgb(${ct_subtext0_h})

    position = -30, -150
    halign = right
    valign = top
}
